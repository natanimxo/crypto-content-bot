# We Talk A Lot -- the operator's own file: poll pairs, hashtags and per-category format switches. Read by pipeline/verbatim.py. Edit freely; no code change needed
# (the header pool is a DRAFT written 2026-11-20 -- "I'll edit them"). Headers are picked by CODE, one per card, cycling through the whole pool before any repeats. The model never writes one.

# Poll pairs for the Poll button on a preview (a native 2-option poll sent to the operator to forward). A category's own pairs come first, then `default`.
polls:
  default:
    - {question: "Verdict?", options: ["Straight to jail", "Let them cook"]}
    - {question: "Rate it", options: ["Spot in heaven", "Spot in hell"]}
    - {question: "Be honest", options: ["Funny", "Too far"]}
  weird_news:
    - {question: "Verdict?", options: ["Straight to jail", "Let them cook"]}
    - {question: "Would you have done it?", options: ["Obviously", "Never"]}
    - {question: "Believable?", options: ["Sadly yes", "Absolutely not"]}
  satire:
    - {question: "Is it fake?", options: ["Obviously fake", "Sadly plausible"]}
    - {question: "Could this be real?", options: ["Tomorrow's news", "Pure fiction"]}
  jokes:
    - {question: "Rate the joke", options: ["Spot in heaven", "Spot in hell"]}
    - {question: "Too dark?", options: ["Not dark enough", "Too far"]}

# Hashtags (operator 2026-11-21): jokes carry exactly #WeTalkALot #Jokes; every other category #WeTalkALot plus its one category tag. Fixed, no model involved.
hashtags:
  weird_news: ["#WeTalkALot", "#WeirdNews"]
  satire: ["#WeTalkALot", "#Satire"]
  jokes: ["#WeTalkALot", "#Jokes"]
  dark_history: ["#WeTalkALot", "#DarkHistory"]
  unusual_deaths: ["#WeTalkALot", "#UnusualDeaths"]
  world_records: ["#WeTalkALot", "#WorldRecords"]
  conspiracies: ["#WeTalkALot", "#Conspiracies"]
  weird_facts: ["#WeTalkALot", "#WeirdFacts"]
  shower_thoughts: ["#WeTalkALot", "#ShowerThoughts"]
  trending_jokes: ["#WeTalkALot", "#TrendingJokes"]

# The "Outlet, 20 Nov:" line under the header on news and satire cards (it names the outlet; set false for a post with nothing source-related in it).
show_dateline: true

# JOKES ONLY, TWICE A DAY (operator 2026-11-22: "I'll feed everything else manually"). notify sends only `active_categories` for this channel, and only in the runs whose UTC hour is in `send_hours_utc` (the group-B cron fires at
# 02 06 10 14 18 22 UTC, so 6 and 18 are the 09:00 and 21:00 runs in the operator's time; one card each, at most). The other categories' collectors are paused in pipeline/cycle_groups.py (code, libraries and config untouched). To resume
# a category: add it to `active_categories` here AND its collector back to a group in pipeline/cycle_groups.py; to send at other hours, edit `send_hours_utc`.
active_categories: [jokes]
send_hours_utc: [6, 18]

# MODE (operator 2026-11-21): every category is `mode: raw` = the source's exact words in the source's order; DeepSeek never changes, adds, removes or reorders a word, it only picks paragraph breaks
# (code does the bold title and spacing), and the exact-words check (pipeline/verbatim.py) sends the unformatted original if any word differs. A `written` mode (pipeline/written.py: DeepSeek writes the whole
# post, SKIP loop) exists in the code but is OUT of use (operator 2026-11-21, 'in case I change my mind'): it only runs for a category set to `mode: written` AND with `written_live: true`.
written_live: false

# Per-category format switches.
#   label        what the model is told the category is (for the paragraph breaks)
categories:
  weird_news:
    label: "weird and absurd real news"
    mode: raw
  satire:
    label: "satire article"
    mode: raw
  jokes:
    label: "dark jokes"
    mode: raw
  dark_history:
    label: "dark and bizarre history"
    mode: raw
  unusual_deaths:
    label: "unusual deaths"
    mode: raw
  world_records:
    label: "absurd world records"
    mode: raw
  conspiracies:
    label: "conspiracy theories (true and hilariously wrong)"
    mode: raw
  weird_facts:
    label: "weird facts"
    mode: raw
  shower_thoughts:
    label: "shower thoughts"
    mode: raw
  trending_jokes:
    label: "trending topic"
    mode: raw
