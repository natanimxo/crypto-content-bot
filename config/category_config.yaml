# Category config — source of truth checked into git.
# `scripts/seed_config.py` upserts this into the `category_config` DB table on setup
# (and whenever you want to reset the DB back to these defaults). Once seeded, the
# *DB row* is what the pipeline actually reads at runtime — an operator can tune
# thresholds/weights/models directly in Supabase without a redeploy; re-running the
# seed script overwrites that with what's checked in here, so treat this file as the
# versioned baseline, not something the pipeline re-reads every cycle.
#
# Per Section 0 of the spec: only one category is built end-to-end for the MVP.
# More categories get appended here in Phase 2/3 (Section 16) — do not pre-fill
# categories that have no collector yet, it invites config/code drift.

defi_yields:
  # Score weights must sum to 1.0. These are starting values — Section 7 of the spec
  # says to recalibrate later against real accept/reject decisions, not to get them
  # perfect now.
  score_weights:
    impact: 0.35        # size of the TVL/APY move, or absolute yield level for a new pool
    novelty: 0.25        # new pool vs. one we've already surfaced recently (see cooldown)
    credibility: 0.25    # protocol age, audit status, TVL floor (rules out unaudited micro-pools)
    actionability: 0.15  # pool still open, chain/asset accessible, no obvious withdrawal gate

  review_threshold: 50   # 0-100. Below this, an item never reaches an LLM at all (Section 7).
  cooldown_hours: 6      # suppress re-surfacing the same pool/protocol within this window
  soft_daily_cap: 6      # per spec's suggested 4-8 range for Crypto Notebook (Section 17)

  # Section 8 calls out "yield changes" by name as a structured category that
  # should use a plain Python template instead of a real LLM call for the triage
  # line — the numbers ARE the summary. See pipeline/llm_providers/template.py.
  triage_model: template
  write_model: deepseek-v4-flash    # final post writer, until the Sonnet benchmark settles it (Section 4.3)
  # Deliberately NOT 'trial' — the operator wants to evaluate DeepSeek's writing
  # quality on its own first before spending on Anthropic credit, rather than
  # buying in upfront under pressure to use it. 'settled_deepseek' means "single-
  # variant write, no A/B" without claiming the benchmark question is actually
  # settled — this is a real config value from the Section 6 schema, not a hack.
  # Flip back to 'trial' once ANTHROPIC_API_KEY is added and a real comparison
  # period is wanted (Section 4.3).
  write_benchmark_status: settled_deepseek

  label: "🌾 DEFI YIELDS"           # operator routing header / digest eyebrow (Section 10)

  # Subscriber-facing post template fields (2026-09-10 delivery/formatting
  # overhaul, Section 8). emoji is the ONE leading emoji on the post's title
  # line — nothing else in the post gets an emoji except an optional ⚠️ risk
  # flag. display_label/hashtags are metadata, not rendered in the post body
  # (titles must be item-specific, never a category label) — display_label is
  # here for config clarity and future use (e.g. cross-posting elsewhere).
  emoji: "🌾"
  display_label: "DeFi Yields"
  hashtags:
    - "#DeFi"
    - "#Yield"

  voice: educational
  # Structure is now fixed in code (pipeline/post_format.py), not prose
  # instructions here — the LLM only writes title/narrative/why_it_matters as
  # JSON; history/risk/source/hashtags are assembled deterministically. These
  # notes shape ONLY the prose the model is asked to write.
  prompt_notes: >
    Frame every post as teaching the mechanic, not chasing the yield. Explain *why* the
    APY is what it is (emissions vs. real fees, lockups, IL risk) before saying whether
    it's worth watching. Never use language that could read as investment advice —
    describe what the numbers show, not what the reader should do with their money.
    Measured tone throughout: no hype language, no "🚀 MOONING", no manufactured
    urgency, no emoji beyond what the template itself adds. This channel is
    region_profile 'us' — keep financial framing conservative and factual,
    never anything that could read as a recommendation to deposit funds.

# Phase 2, category 2 of 2026-09-10 — whale_movements -> Crypto Wall Street.
# Watches known exchange hot wallets (not speculative "whale" addresses — no
# reliable free source for those) for large in/out transfers. See BACKLOG.md
# / commit history for the full plan discussion and operator sign-off.
whale_movements:
  score_weights:
    impact: 0.30          # transfer size in USD, log-scaled
    novelty: 0.30          # raised vs. defi_yields' 0.25 — "is this unusual for
                            # this wallet" carries as much story as "how big"
                            # here; cooldown-adjusted against recent flagged
                            # moves for the same exchange+direction pair
    credibility: 0.20      # REDEFINED, not copied from defi_yields (operator
                            # direction 2026-09-10): "every watchlist address is
                            # curated" would make this a near-constant, so it's
                            # not about the exchange side at all — it's the
                            # COUNTERPARTY wallet's own establishment (age +
                            # tx count). A transfer touching a long-lived,
                            # active counterparty is a more credible "real
                            # economic activity" signal than one touching a
                            # brand-new, one-off address (higher exploit/mixer/
                            # wash-trade risk) — this genuinely varies per item.
    actionability: 0.20    # single-exchange in/out (clear directional signal:
                            # deposit=possible sell pressure, withdrawal=possible
                            # accumulation) scores higher than exchange<->exchange
                            # (ambiguous market read)

  review_threshold: 50
  cooldown_hours: 6
  soft_daily_cap: 12       # spec Section 17 suggestion: 8-15 for crypto channels

  # $2M, not the originally-proposed $500k — operator direction 2026-09-10:
  # exchange hot wallets move $500k as routine operations; at that floor this
  # would surface noise, not signal. DB-tunable (category_config.collect_min_usd)
  # specifically so it can come down later if real daily volume proves thin,
  # without a redeploy.
  collect_min_usd: 2000000

  triage_model: template   # wallet/amount/direction/counterparty are fully
                            # structured facts — no synthesis needed, same
                            # reasoning as defi_yields' template triage.
  write_model: deepseek-v4-flash
  write_benchmark_status: settled_deepseek   # same reasoning as defi_yields —
                                              # evaluate DeepSeek alone first

  label: "🐋 WHALE MOVEMENTS"

  emoji: "🐋"
  display_label: "Whale Watch"
  hashtags:
    - "#WhaleAlert"
    - "#OnChain"

  voice: market_summary
  # Crypto Wall Street's angle (spec Section 3: "Restores its market-summary
  # identity") is tight and factual, not educational — a different register
  # from Crypto Notebook. Structure is fixed in code (pipeline/post_format.py);
  # these notes shape only the LLM's prose.
  prompt_notes: >
    Tight market-summary register: report the move, state the likely read
    (accumulation vs. distribution signal), stop. No teaching, no mechanic
    explainers — this is a faster, more direct voice than Crypto Notebook's.
    Never state a price prediction or tell the reader what to do with their
    own funds — describe what moved and what that typically signals, not
    financial advice. Measured tone: no hype, no manufactured urgency, no
    emoji beyond what the template itself adds.

# Phase 2, category 3 of 2026-09-10 — web3_jobs -> Alpha Edge Crypto / CoinCraft
# (shared, alternation via pipeline/channel_router.py — spec Section 3). Moved
# faster than the first two: structured data, no price verification, no
# editorial judgment about listing quality/meaning needed.
web3_jobs:
  score_weights:
    impact: 0.25          # compensation quality/transparency (log-scaled salary_max)
    novelty: 0.15          # freshness -- genuine early opportunity vs. sitting for weeks
    credibility: 0.30      # listing legitimacy -- web3 job boards see real scam volume
    actionability: 0.30    # remote-accessibility (geo-open vs. region-restricted) + apply-ability

  review_threshold: 50
  # topic_key is each listing's own id (not company) -- cooldown is
  # deliberately near-irrelevant for this category: two DIFFERENT job
  # postings from the same company are two different real opportunities,
  # not a repeat of the same information the way a re-surfaced DeFi pool or
  # whale wallet topic would be. Exact-listing dedup already happens for
  # free via the UNIQUE(source_id, external_id) constraint at the raw_items
  # level, independent of this.
  cooldown_hours: 1
  soft_daily_cap: 8

  triage_model: template   # position/company/salary/location are fully structured facts
  write_model: deepseek-v4-flash
  write_benchmark_status: settled_deepseek

  label: "💼 WEB3 JOBS"

  emoji: "💼"
  display_label: "Web3 Jobs"
  hashtags:
    - "#Web3Jobs"
    - "#CryptoJobs"

  voice: opportunity_framed
  # No history blockquote for this category (pipeline/write_post.py's
  # compute_web3_jobs_elements always returns history_line=None) — a job
  # posting isn't a recurring signal the way a wallet's past moves or a
  # pool's yield trend are; forcing memory here would be padding, exactly
  # what Section 1's differentiator is supposed to avoid.
  prompt_notes: >
    Factual and direct: what the role is, who it's for, why it's worth a second
    look. Never inflate a listing beyond what the facts say — if salary isn't
    disclosed, say so plainly rather than implying it's competitive. No hype
    language, no "AMAZING OPPORTUNITY", no manufactured urgency. Measured tone,
    no emoji beyond what the template itself adds.

# Phase 2/3, 2026-09-11 — gems_security -> Crypto Notebook (shares the channel
# with defi_yields). Discovery reuses defi_yields' own DefiLlama pool feed
# (operator-approved plan) rather than a separate source — see
# collectors/gems_security.py's module docstring for the full reasoning,
# the rate-limit math, and pipeline/goplus.py for the live-measured GoPlus
# Token Security API behavior this whole category is built on.
#
# Editorial premise (operator-approved, deliberately narrow): flag risk, don't
# endorse safety. This category ONLY ever posts when a pool with real TVL has
# a token carrying a genuine, specific GoPlus red flag — there is no "notable
# launch, clean check" case. A clean result isn't a claim worth making
# publicly: without a concrete concern to name, that post is just "here's a
# token," promotion regardless of hedging, and the downside of a reader
# losing money on something highlighted as clean isn't offset by a disclaimer.
gems_security:
  score_weights:
    impact: 0.30          # TVL exposed, log-scaled — how much real money is at stake
    novelty: 0.15          # how recently this pool showed up in defi_yields' own feed
    credibility: 0.35      # severity/certainty of the finding, weighted per field —
                            # highest weight, since "how bad is this" IS the news value
                            # here, more than freshness or even raw dollar exposure
    actionability: 0.20    # completeness of the check (checked vs. unknown critical
                            # fields) — a thinner check is a weaker, less actionable
                            # warning; keeps "unknown is never coded as clear" true in
                            # the score itself, not just the prose (operator direction)

  review_threshold: 50
  # A confirmed bad-token finding on the SAME token doesn't go stale in days
  # the way a whale move or job listing does — 72h suppresses re-notifying
  # about the same risky token if it resurfaces in a different pool shortly
  # after (topic_key is the flagged token's own contract address, not the
  # pool_id — see _topic_key() in collectors/gems_security.py).
  cooldown_hours: 72
  soft_daily_cap: 4       # deliberately low — this is meant to be rare and notable,
                            # not a daily quota to fill (narrow editorial premise above)

  triage_model: template   # structured findings, no synthesis needed
  write_model: deepseek-v4-flash
  write_benchmark_status: settled_deepseek

  label: "🚨 GEM SECURITY CHECK"

  emoji: "🚨"
  display_label: "Security Screen"
  hashtags:
    - "#TokenSecurity"
    - "#DYOR"

  voice: educational
  # No history blockquote (pipeline/write_post.py's compute_gems_security_elements
  # always returns history_line=None) — a security finding isn't a recurring
  # signal the way a wallet's past moves are. Structure is fixed in code
  # (pipeline/post_format.py); these notes shape only the LLM's prose, and the
  # prompt itself (build_gems_security_prompt) hands the LLM a pre-determined
  # finding rather than asking it to render its own verdict — see that
  # function's docstring for the full "teach the pattern, never overstate
  # certainty" enforcement chain.
  prompt_notes: >
    Teach the pattern, not just the finding: name the specific automated check
    that triggered this post, explain in plain terms what that pattern enables
    and why it matters, and tell the reader how they could check the same
    thing themselves on any token. Never render a safety verdict — you are
    reporting what a specific, limited automated check found, not vouching for
    or against a project. Never say or imply a token is safe, legit, or worth
    buying/depositing into, even by omission. Measured tone: no hype, no
    manufactured urgency, no emoji beyond what the template itself adds.

# Phase 3, 2026-09-11/12 — news -> Crypto Wall Street (alongside
# whale_movements). Deliberate spec deviation, operator-approved: skips
# CryptoPanic entirely for a curated list of original-outlet RSS feeds (see
# collectors/news.py's module docstring for the full sourcing/dedup/
# credibility design and the live verification behind each choice).
news:
  score_weights:
    impact: 0.40          # cross-outlet corroboration + concrete figures --
                            # how big/market-moving, not a dollar amount we
                            # collect ourselves the way other categories can
    novelty: 0.30          # news moves fast -- full novelty at 0h, ~0 by 36h old
    actionability: 0.30    # does this name a trackable ticker/asset a reader
                            # can actually follow, vs. vague general-interest
    # No credibility key (operator-approved, 2026-09-11): checked real
    # category/author data across every candidate feed first -- the real
    # signal found (explicit Opinion/newsletter-recap categories) is binary,
    # not a scale, so it's collectors/news.py's _is_original_reporting()
    # pre-score gate instead, not a scored, weighted component. Weight
    # redistributed to the three components above rather than left dead.

  review_threshold: 50
  # topic_key is the story's primary extracted entity (pipeline/entities.py)
  # -- coarser than "the exact same event", closer to "the same primary
  # subject". cooldown_hours suppresses recycled restatements of that
  # subject; genuine developments still get through via the status-change
  # keyword override in collectors/news.py, not by raising this.
  cooldown_hours: 12
  soft_daily_cap: 10

  triage_model: template   # a headline is already a one-line summary
  write_model: deepseek-v4-flash
  write_benchmark_status: settled_deepseek

  label: "📰 NEWS"

  emoji: "📰"
  display_label: "News"
  hashtags:
    - "#CryptoNews"

  voice: market_summary
  # Crypto Wall Street's tight, factual register (see whale_movements'
  # prompt_notes for the same voice) -- report what happened and why it
  # matters, stop. The real differentiator for this category isn't voice,
  # it's substance: never restate the headline (operator direction
  # 2026-09-11 — "a post that rephrases the article adds nothing"), and
  # never reproduce the source's prose or structure (enforced structurally
  # in pipeline/write_post.py's _find_reproduction_issues, not just
  # requested here).
  prompt_notes: >
    Tight, factual, market-summary register. Explain the story's significance
    or implication in your own words — never restate the headline or closely
    paraphrase the source excerpt's wording or structure. A short, clearly
    quoted and attributed phrase is fine; reproducing sentences is not. Never
    state a price prediction or tell the reader what to do with their own
    funds. Measured tone: no hype, no manufactured urgency, no emoji beyond
    what the template itself adds.
