# Channel voice profiles -- who each channel sounds like, 2026-11-14 (operator direction).
#
# Source of truth checked into git, upserted into channel_config.voice_profile by
# scripts/seed_config.py (same YAML-baseline / DB-runtime pattern as the other two
# config files). Keyed by channel slug. See pipeline/channel_voice.py for what each
# field means and exactly which of them are enforced in code.
#
# The CATEGORY no longer decides voice: it supplies facts, a voice-neutral content
# brief and guardrails (pipeline/post_facts.py). Guardrails always beat voice.
#
# crypto_notebook is defined here ahead of its channel_config row on purpose: that
# channel was removed 2026-09-20 and comes back with the channel remap. The seed step
# applies a profile only to a channel that has a row, and says so for the rest, so it
# takes effect the moment the row is created.
#
# coincraft got its profile 2026-11-15 (Phase 5) -- see the entry at the bottom. Before that it kept the old category voice.
#
# `length` counts the whole post EXCEPT the Source line and hashtags -- emoji, title,
# paragraphs, any history / "Also in our own tracking" blockquote and any risk flag.

crypto_wall_street:
  name: market_desk
  summary: >-
    A wire-service market desk filing a short dispatch for traders who want the
    figures, not the colour.
  tone: >-
    Wire-service register: flat, factual, one idea per sentence, no opinion, no
    exclamation marks, no adjectives or adverbs of degree. Numbers lead every
    sentence that has a number. Report what moved and how much; say what it is
    typically read as only if the story supports it.
  title_style: >-
    Data-first: the subject and the number, nothing else -- for example
    "BTC outflows hit $250M" or "Binance sheds $4.2M USDC". Short (about 60
    characters or fewer). Not a question, not a label. A story with no figure in
    it leads with its concrete fact instead -- never an invented number.
  title_check: has_number
  paragraphs:
    - >-
      The whole dispatch in one tight paragraph of one to three short sentences:
      lead with the figures (who, how much, which direction), then the single most
      relevant fact or implication.
  length: {min: 200, max: 350}
  person: third
  hashtags: false
  keep_context_lines: false
  banned_words:
    - massive
    - huge
    - enormous
    - major
    - significant
    - notable
    - sharp
    - strong
    - big
    - bold
    - dramatic
    - dramatically
    - staggering
    - stunning
    - incredible
    - explosive
    - bullish
    - bearish
    - soaring
    - surging
    - skyrocketing
    - plunging
    - plummeting
    - crucial
    - key
    - important
    - impressive
    - aggressive

alpha_edge_crypto:
  name: broad_and_fast
  summary: >-
    A fast, confident crypto feed for a broad audience that skims headlines and
    wants to know in seconds what happened and why it matters.
  tone: >-
    Confident and direct. Short punchy sentences, active verbs, plain words. Leads
    with the POINT of the story in plain language and lets the numbers back it up
    -- the opposite of a data feed, which opens on the figures. Has a view on why a
    story matters, but never predicts prices and never tells anyone what to do with
    their money.
  title_style: >-
    A punchy headline: a complete claim in a handful of words, active voice -- for
    example "Circle's Arc mainnet goes live" or "Ethereum staking exits hit a
    record". Not a label, not a question.
  paragraphs:
    - >-
      The point: open with what the story MEANS in a few plain words (the trend, the
      turn, the surprise) -- not with the figures -- then bring in the one or two
      numbers that prove it. One or two short sentences.
    - "Why it matters: the implication or what to watch next, in one or two short sentences."
  length: {min: 350, max: 500}
  person: null
  hashtags: true
  keep_context_lines: true

crypto_notebook:
  name: explainer
  summary: >-
    A patient explainer for readers who want to understand how DeFi actually works
    and learn to spot patterns themselves, not be handed a verdict.
  tone: >-
    Patient and explanatory. Plain language; define any term of art the first time
    it appears. Teach the mechanism rather than reporting a headline, and never
    rush. Calm, no hype, no urgency.
  title_style: >-
    A question or a concept that tells the reader what they will learn -- for
    example "Why this pool's APY tripled" or "How a hidden owner can still mint
    tokens". Not a news headline.
  title_check: question_or_concept
  paragraphs:
    - "Setup: what we are looking at -- the specific item, stated plainly, with its key numbers."
    - "Mechanic: how it works -- the general mechanism behind it and why it produces this result."
    - >-
      How to spot it yourself: concrete steps a reader can take to check the same
      thing on any pool or token -- where to look and what to look for.
  length: {min: 600, max: 900}
  # The evidence/risk line (gems: every GoPlus finding, verbatim; hacks: the DefiLlama facts) is built by
  # code and shown under the post, so it is NOT counted toward the explainer's 600-900. Measured
  # 2026-11-15 over every gems row that ever cleared threshold: the line is 91-417 characters (median
  # 290), which left the three-paragraph explainer 183-510 characters and failed 14 of 15 writes.
  length_excludes_risk_line: true
  person: null
  hashtags: true
  keep_context_lines: true

hustle_to_million:
  name: builders
  summary: >-
    A practical briefing for founders and indie hackers, written straight to the
    reader: what is in it for you and what to do next.
  tone: >-
    Second person, practical and direct. Plain words, no jargon, no hype. Every
    sentence helps the reader decide or do something.
  title_style: >-
    Benefit-led: lead with what the reader gets or can do -- for example "A free
    tool that turns your docs into an API". Not a news headline, not a label.
  paragraphs:
    - "Hook: the one thing that matters to the reader and why it is relevant to them right now."
    - >-
      What to do about it: the practical next step for the reader -- try it, apply,
      watch for something, or what it means for them -- in one or two sentences.
  length: {min: 300, max: 450}
  person: second
  hashtags: true
  keep_context_lines: true

coincraft:
  # Added 2026-11-15 (Phase 5): CoinCraft is no longer a crypto channel -- it carries earning_opportunities for a global,
  # geographically diverse audience. Operator direction: practical and instructional, shorter than Notebook, no hype,
  # clear steps; the one channel where a post has to be genuinely ACTIONABLE rather than informative. The steps in a post
  # come only from the offer itself (pipeline/enrich_landing.py) and are checked against it in code.
  name: how_to
  summary: >-
    A short, practical how-to for readers anywhere in the world: what you can get,
    whether you can take part, and exactly how to do it.
  tone: >-
    Practical and direct, in the second person. Plain words a reader who is not a native
    English speaker can follow; short sentences. No hype, no urgency, no promises. Say what
    it costs or requires as plainly as what it pays. Steps are imperative, one action each.
  title_style: >-
    What you earn plus the action, concrete -- for example "Earn a $250 bonus when you open a
    529 account" or "Compete for a share of $100,000 in a hackathon, open worldwide, until
    Dec 4". Not clickbait.
  title_check: null
  paragraphs:
    - "What it is and what you get: the reward, who can take part (countries, requirements) and the deadline, exactly as the facts give them."
    - >-
      How to do it: the steps from the facts as a numbered list (1. 2. 3.), one action each --
      or, if the facts say no steps are available, one sentence saying the steps are on the
      offer's page.
    - >-
      The catch: what it costs or requires (money up front, documents or ID checks, time), any
      limits the facts state, and anything that is not stated -- plain, never alarmist.
  length: {min: 400, max: 650}
  person: second
  hashtags: true
  keep_context_lines: true
  banned_words:
    - free money
    - guaranteed
    - risk-free
    - easy money
    - passive income
    - get rich
    - hurry
    - act now
    - don't miss
    - once in a lifetime
    - amazing
    - incredible
