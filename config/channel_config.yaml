# Channel config — source of truth checked into git, upserted into `channel_config`
# by scripts/seed_config.py. See config/category_config.yaml for the same DB-vs-YAML
# note: the DB row is what the pipeline reads at runtime; this file is the versioned
# baseline you reset back to.
#
# chat_id is kept for potential future reactivation of direct publishing, but is
# NOT used as of 2026-09-10 — the bot never posts to a channel itself anymore
# (see pipeline/publish.py); the operator copies/forwards the labeled text
# themselves after tapping "Mark as sent". display_name IS actively used — it's
# the human-readable half of the label header every post arrives with (e.g.
# "🌾 DEFI YIELDS → CoinCraft"), since the operator needs to know at a
# glance which channel a post is for when copying it themselves.
#
# Channel -> category mapping, rebalanced 2026-09-20 (operator direction; crypto_notebook was
# brought back 2026-11-15 -- see the PHASE 3 REMAP note below):
# crypto_notebook was REMOVED entirely -- the operator writes its content by
# hand now, so nothing in this pipeline feeds it and it has no row here or in
# the DB (scripts/seed_config.py prunes DB rows that aren't in this file, so
# removing a channel here actually removes it, instead of leaving a stale row
# that keeps getting routed to). defi_yields -> alpha_edge_crypto and
# gems_security -> coincraft, ONE category each on purpose so each channel has a
# distinct identity (they're priced separately for ads); web3_jobs stays
# shared across both via pipeline/channel_router.py's alternation.
# bot/notify.py skips any category that doesn't have a category_config row yet.
#
# PHASE 3 REMAP, 2026-11-15 (operator direction): crypto_notebook is BACK, as the educational
# channel -- gems_security + hacks_exploits move to it from CoinCraft (voice: config/channel_voices.yaml).
# CoinCraft is left with NO categories on purpose: it becomes the non-crypto earning-opportunities
# channel in Phase 5, and the row has to survive until then. A channel with `categories: []` is
# safe everywhere it is read (bot/notify.py visits it, finds no candidates, sends nothing). The
# category -> channel table is now:
#   crypto_wall_street: news (shared), whale_movements, exchange_listings (2026-11-15)
#   alpha_edge_crypto:  news (shared), defi_yields (whole -- NOT split)
#   crypto_notebook:    gems_security, hacks_exploits
#   hustle_to_million:  tool_launches, startup_jobs, macro_news
#   coincraft:          earning_opportunities (Phase 5, 2026-11-15)
#
# chat_ids below were given explicitly by the operator (not inferred from any
# ordering) — confirmed correct as of the mapping they provided.
#
# UPDATED 2026-09-30 (operator direction): news now shared crypto_wall_street /
# alpha_edge_crypto via alternation (pipeline/channel_router.py) -- real
# headroom, news clears review_threshold ~35/day against a single channel's
# 10/day category cap. defi_yields stays alpha_edge_crypto-only, deliberately
# NOT split with coincraft (operator: "highest-priced channel, steady volume
# is what I'm selling on it" -- splitting was evaluated and would cost it
# ~20% of its own volume for CoinCraft's gain, real but not worth the trade).
# coincraft gets a new category instead: hacks_exploits (see category_config.
# yaml) -- complements gems_security (pre-hack risk screening) with confirmed
# post-hack incidents, no cost to any other channel.
#
# CHANNEL-LEVEL soft_daily_cap raised on both crypto_wall_street (12 -> 16)
# and alpha_edge_crypto (12 -> 16), same date, for a real reason found while
# wiring the news split, not a round-number guess: crypto_wall_street's
# combined demand (news's own cap 10 + whale_movements' realistic ~4-6/day --
# its nominal cap of 12 is never actually approached) was ALREADY hitting
# exactly 12 on 9 of the last 14 days BEFORE this change, meaning the
# channel-level cap was silently trimming news below its own 10/day category
# cap even pre-split. Left at 12, it would only get worse once Alpha Edge
# also draws from the same news pool. alpha_edge_crypto's own combined demand
# (defi_yields' cap 6 + news' cap 10) can reach 16 on a busy day; capping the
# channel at 12 would let the channel-level trim silently eat into
# defi_yields' steady volume -- the one thing the operator explicitly said
# not to touch -- depending on which category's candidates happen to score
# higher that cycle. 16 = sum of each channel's two live categories' own
# per-category caps, so the channel cap is a backstop that doesn't bind
# ahead of either category's own pacing, not a new hidden bottleneck.

crypto_wall_street:
  display_name: "Crypto Wall Street"
  categories:
    - news            # shared with alpha_edge_crypto since 2026-09-30, see note above
    - whale_movements
    - exchange_listings   # added 2026-11-15 (Phase 4): spot listings on Binance/OKX/Bybit/KuCoin, WS only
  region_profile: default
  soft_daily_cap: 16   # raised from 12 -- see 2026-09-30 note above
  chat_id: "-1001200205264"

alpha_edge_crypto:
  display_name: "Alpha Edge Crypto"
  categories:
    # airdrops deliberately paused 2026-09-10 (operator direction) — not built
    # yet anyway (no collector/scorer), left out entirely rather than listed-
    # but-skipped so it's not silently doing nothing. Add it back here once
    # Section 16 Phase 2 actually builds the airdrops category.
    - defi_yields     # moved here from crypto_notebook 2026-09-20 (first to coincraft, then
                       # swapped same day): this is the highest-priced, US-heavy crypto
                       # channel (~13k subs) and needs STEADY volume for advertisers --
                       # defi_yields clears threshold ~7/day, gems_security ~0-1/day.
                       # Deliberately NOT shared with coincraft (2026-09-30 operator
                       # direction) -- see note above.
    - news            # shared with crypto_wall_street since 2026-09-30, see note above --
                       # real headroom (news clears ~35/day against a 10/day cap), gives
                       # this channel its own news content without touching Wall Street's.
    # web3_jobs RETIRED 2026-11-14 (operator direction, Phase 2) -- dry RemoteOK feed. Removed from
    # this channel and from coincraft; the collector is no longer run (scripts/collect_cycle.py).
  region_profile: us
  soft_daily_cap: 16   # raised from 12 -- see 2026-09-30 note above
  chat_id: "-1001992993907"

crypto_notebook:
  display_name: "Crypto Notebook"
  categories:
    - gems_security   # moved here from coincraft 2026-11-15 (Phase 3). Rare by design: category
                       # soft_daily_cap 4, and only 15 gems rows have ever scored >= the review
                       # threshold (50) since 2026-09-11, 9 of them notified.
    - hacks_exploits  # moved here from coincraft 2026-11-15 (Phase 3): confirmed incidents are the
                       # same "learn to spot it" material as the security findings.
  region_profile: default
  soft_daily_cap: 8    # = the two category caps (4 + 4), as for the other channels; combined demand is
                        # realistically ~1-2/day, so this is a backstop, not a bottleneck
  chat_id: "-1002905948541"   # the channel's original chat_id, from before it was removed 2026-09-20; unused (see top)

coincraft:
  display_name: "CoinCraft"
  categories:
    - earning_opportunities   # Phase 5, 2026-11-15: the non-crypto earning-opportunities channel (global audience).
                               # Telegram (t.me/s/) + RSS/API sources; Discord hub to follow.
  region_profile: default
  soft_daily_cap: 8    # = the category's own cap; real volume will tell
  chat_id: "-1002704031424"

hustle_to_million:
  display_name: "Hustle to Million"
  categories:
    - tool_launches
    - startup_jobs
    - macro_news    # added 2026-09-12 -- see config/category_config.yaml's
                     # macro_news section for the full editorial/neutrality design
    # grants deliberately out of scope (operator direction 2026-09-12,
    # live-verified) -- same "documented, not silently missing" treatment
    # as airdrops above: Grants.gov is real but US federal research grants,
    # not builder/indie-hacker grants; DevPost's API is bot-blocked (403);
    # F6S/YC/Antler/Techstars expose marketing pages, not feeds. No
    # structured source exists for what this audience means by "grants" --
    # would be curation work, not a collector. See BACKLOG.md's "Hustle to
    # Million" section and intelligence-bot-spec-v2.md Section 3/16 for the
    # full reasoning.
  region_profile: default
  soft_daily_cap: 6
  chat_id: "-1001897854375"
