# Channel config — source of truth checked into git, upserted into `channel_config`
# by scripts/seed_config.py. See config/category_config.yaml for the same DB-vs-YAML
# note: the DB row is what the pipeline reads at runtime; this file is the versioned
# baseline you reset back to.
#
# chat_id is kept for potential future reactivation of direct publishing, but is
# NOT used as of 2026-09-10 — the bot never posts to a channel itself anymore
# (see pipeline/publish.py); the operator copies/forwards the labeled text
# themselves after tapping "Mark as sent". display_name IS actively used — it's
# the human-readable half of the label header every post arrives with (e.g.
# "🌾 DEFI YIELDS → CoinCraft"), since the operator needs to know at a
# glance which channel a post is for when copying it themselves.
#
# Channel -> category mapping, rebalanced 2026-09-20 (operator direction):
# crypto_notebook was REMOVED entirely -- the operator writes its content by
# hand now, so nothing in this pipeline feeds it and it has no row here or in
# the DB (scripts/seed_config.py prunes DB rows that aren't in this file, so
# removing a channel here actually removes it, instead of leaving a stale row
# that keeps getting routed to). defi_yields -> alpha_edge_crypto and
# gems_security -> coincraft, ONE category each on purpose so each channel has a
# distinct identity (they're priced separately for ads); web3_jobs stays
# shared across both via pipeline/channel_router.py's alternation.
# bot/notify.py skips any category that doesn't have a category_config row yet.
#
# chat_ids below were given explicitly by the operator (not inferred from any
# ordering) — confirmed correct as of the mapping they provided.

crypto_wall_street:
  display_name: "Crypto Wall Street"
  categories:
    - news
    - whale_movements
  region_profile: default
  soft_daily_cap: 12   # spec Section 17 suggestion: 8-15 for crypto channels
  chat_id: "-1001200205264"

alpha_edge_crypto:
  display_name: "Alpha Edge Crypto"
  categories:
    # airdrops deliberately paused 2026-09-10 (operator direction) — not built
    # yet anyway (no collector/scorer), left out entirely rather than listed-
    # but-skipped so it's not silently doing nothing. Add it back here once
    # Section 16 Phase 2 actually builds the airdrops category.
    - defi_yields     # moved here from crypto_notebook 2026-09-20 (first to coincraft, then
                       # swapped same day): this is the highest-priced, US-heavy crypto
                       # channel (~13k subs) and needs STEADY volume for advertisers --
                       # defi_yields clears threshold ~7/day, gems_security ~0-1/day.
    - web3_jobs       # shared with coincraft via alternation; RemoteOK feed is dry
                       # right now (same 13 listings since Sep 10), left wired.
  region_profile: us
  soft_daily_cap: 12
  chat_id: "-1001992993907"

coincraft:
  display_name: "CoinCraft"
  categories:
    # airdrops paused — see alpha_edge_crypto's note above, same reasoning.
    - gems_security   # moved here from crypto_notebook 2026-09-20. Rare by design
                       # (category soft_daily_cap: 4, ~0-1 real candidates/day) -- a
                       # deliberate low-volume feed, kept off the volume-sensitive channel.
    - web3_jobs       # shared with alpha_edge_crypto via alternation (dry source, left wired)
  region_profile: default
  soft_daily_cap: 12
  chat_id: "-1002704031424"

hustle_to_million:
  display_name: "Hustle to Million"
  categories:
    - tool_launches
    - startup_jobs
    - macro_news    # added 2026-09-12 -- see config/category_config.yaml's
                     # macro_news section for the full editorial/neutrality design
    # grants deliberately out of scope (operator direction 2026-09-12,
    # live-verified) -- same "documented, not silently missing" treatment
    # as airdrops above: Grants.gov is real but US federal research grants,
    # not builder/indie-hacker grants; DevPost's API is bot-blocked (403);
    # F6S/YC/Antler/Techstars expose marketing pages, not feeds. No
    # structured source exists for what this audience means by "grants" --
    # would be curation work, not a collector. See BACKLOG.md's "Hustle to
    # Million" section and intelligence-bot-spec-v2.md Section 3/16 for the
    # full reasoning.
  region_profile: default
  soft_daily_cap: 6
  chat_id: "-1001897854375"
