name: Collect

on:
  # Schedule trigger disabled 2026-09-15 (operator direction) -- collection
  # moved to a Railway cron service (see railway.collect.json), same
  # reasoning that already moved the approval poller off Actions: measured
  # across the last 10 scheduled runs, this cron averaged a 5.4h gap against
  # its intended 4h interval, never once actually hitting schedule (worst
  # gap: 8.2h). File kept in the repo (not deleted) for workflow_dispatch --
  # a manual "Run workflow" button still works for testing/one-off runs
  # without needing to touch the Railway service. Re-enabling the schedule
  # block here WOULD double-collect against the Railway cron job; don't,
  # unless the Railway job is being retired first.
  # schedule:
  #   - cron: "0 */4 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

jobs:
  collect:
    runs-on: ubuntu-latest
    # Raised from 10 -> 20, 2026-09-11: gems_security's GoPlus sweep (up to
    # MAX_GOPLUS_CALLS_PER_RUN=60 real calls at the measured safe ~6s pace,
    # collectors/gems_security.py) plus defi_yields' own small retrofit sweep
    # (score_new_items, ~25 new pools/cycle) can together take up to ~8-9
    # minutes of deliberate pacing on top of the existing ~75s for the other
    # three collectors + notify — 10 minutes no longer has real headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collect cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python scripts/collect_cycle.py
