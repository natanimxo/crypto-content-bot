name: Approval Poll

on:
  schedule:
    # TEMPORARY EXPERIMENT, started 2026-09-10 ~23:00 UTC (operator direction):
    # */5 was configured but never actually honored at anything close to that
    # rate -- measured via `gh run list --json event,createdAt` filtered to
    # event=="schedule" (excludes manual workflow_dispatch runs, which always
    # fire promptly): actual gaps between scheduled Approval Poll runs
    # averaged 3.6h over a 22-hour window (00:40->05:19->09:51->13:55->17:29
    # ->19:59->22:26), never once under 2.4h. That's fatal for the approve
    # loop's whole design -- long-polling (bot/approval_poller.py's
    # LONG_POLL_TIMEOUT_SECONDS) makes EACH run reliable while it's running,
    # but Telegram drops an un-fetched callback_query well under 10 minutes
    # (see BACKLOG.md), so a run every 3.6h still misses nearly every tap.
    # Testing whether */5 was self-inflicted: GitHub Actions' scheduler is
    # documented to deprioritize high-frequency cron hardest, so a less
    # aggressive cadence sometimes gets honored far more consistently than a
    # more aggressive one, counterintuitive as that sounds. */15 here is the
    # test.
    # Revert to */5 -- or escalate to */30, or move this workflow off GitHub
    # Actions' scheduler entirely -- once there's a few hours of real
    # scheduled-run data to compare against the */5 baseline above.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Live-diagnosed 2026-09-10/11: a tapped button's callback_query can vanish
# from Telegram's getUpdates queue well under 10 minutes if nothing is
# actively listening (see bot/approval_poller.py's LONG_POLL_TIMEOUT_SECONDS
# comment for the full deliberate-test writeup) — short-polling once every
# 5-15 minutes was missing most taps. The fix is long-polling for most of the
# gap between cron firings instead of returning immediately, which makes
# overlapping runs a real risk if one run is still mid-long-poll when the
# next is scheduled to start — `concurrency` here queues instead of
# parallelizing, so two runs never call getUpdates against the same offset
# at once.
concurrency:
  group: approval-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Must comfortably exceed LONG_POLL_TIMEOUT_SECONDS (270s = 4m30s) plus
    # setup/dependency-install/any-write overhead — keep these two in sync.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll for operator actions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # whale_movements' write-time history backfill (pipeline/write_post.py)
          # calls Etherscan directly during approve, not just during collect.
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python -m bot.approval_poller
